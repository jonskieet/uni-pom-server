// render.yaml - Render deployment configuration

services:
  - type: web
    name: uni-pom-api
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: uni-pom-db
          property: connectionString
      - key: JWT_SECRET
        sync: false  # Add manually via Render dashboard
      - key: CORS_ORIGIN
        value: https://your-electron-app-domain.com
    disk:
      name: data
      mountPath: /data
      sizeGB: 1

databases:
  - name: uni-pom-db
    ipAllowList: []
