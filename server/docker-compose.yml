# Docker Compose for local development

version: '3.8'

services:
  # PostgreSQL Database (optional - use Supabase instead)
  # db:
  #   image: postgres:15-alpine
  #   environment:
  #     POSTGRES_PASSWORD: postgres
  #     POSTGRES_DB: uni_pom
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data

  # Node.js API Server
  api:
    build: .
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/uni_pom
      JWT_SECRET: dev-secret-key-change-in-production
      CORS_ORIGIN: http://localhost:5173,http://localhost:3000
    # depends_on:
    #   - db
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev

